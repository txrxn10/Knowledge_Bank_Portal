[project]
name = "knowledge-bank-api"
version = "0.1.0"
description = "Enterprise-grade Knowledge Bank API built with FastAPI"
authors = [
    {name = "Your Name", email = "pawan@inspheresolutions.com"}
]
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=app --cov-report=html"
